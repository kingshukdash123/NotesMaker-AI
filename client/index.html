<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Performance & Preconnect Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://img.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <!-- Favicon & PWA Icons (Strictly Adaptive to Browser & OS Appearance Theme) -->
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" id="system-favicon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- High-Priority Preloads for Brand Assets (Prevents layout pop-in & first-paint image flash) -->
    <link rel="preload" as="image" href="/logos/logo-full-white.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/logos/logo-full-black.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/orbit-dp-resize.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/orbit-resize.webp" type="image/webp" />

    <!-- Synchronous Theme Bootstrap & Appearance Listener (Prevents theme flash before first paint) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pathshala_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;

          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          function updateSystemFavicon(e) {
            var isDark = (e && typeof e.matches === 'boolean') ? e.matches : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var fav = document.getElementById('system-favicon');
            if (fav) {
              fav.href = isDark ? '/favicon-dark.png' : '/favicon-light.png';
            }
          }
          updateSystemFavicon(mq);
          if (mq.addEventListener) {
            mq.addEventListener('change', updateSystemFavicon);
          } else if (mq.addListener) {
            mq.addListener(updateSystemFavicon);
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Primary Metadata -->
    <title>Pathshala AI — Distraction-Free Study & Productivity Platform</title>
    <meta name="description" content="One platform for distraction-free study and maximum productivity. Focused educational lectures, structured AI notes, smart planner, and personal AI mentorship." />
    <meta name="keywords" content="distraction-free study, study productivity, AI study notes, student focus, lecture notes, study planner, educational AI, academic productivity, Orbit AI mentor" />
    <meta name="author" content="Pathshala AI" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://pathshalaai.co.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pathshalaai.co.in/" />
    <meta property="og:site_name" content="Pathshala AI" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Pathshala AI — Distraction-Free Study & Productivity Platform" />
    <meta property="og:description" content="One platform for distraction-free study and maximum productivity. Focused educational lectures, structured AI notes, smart planner, and personal AI mentorship." />
    <meta property="og:image" content="https://pathshalaai.co.in/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Pathshala AI - Distraction-Free Study Platform" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://pathshalaai.co.in/" />
    <meta name="twitter:title" content="Pathshala AI — Distraction-Free Study & Productivity Platform" />
    <meta name="twitter:description" content="One platform for distraction-free study and maximum productivity. Focused educational lectures, structured AI notes, smart planner, and personal AI mentorship." />
    <meta name="twitter:image" content="https://pathshalaai.co.in/pwa-512x512.png" />
    <meta name="twitter:image:alt" content="Pathshala AI Logo and Platform Banner" />

    <!-- Baseline Schema.org JSON-LD Structured Data for Search Engine Crawlers -->
    <script type="application/ld+json" id="schema-base-organization">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "EducationalOrganization",
          "@id": "https://pathshalaai.co.in/#organization",
          "name": "Pathshala AI",
          "url": "https://pathshalaai.co.in",
          "logo": {
            "@type": "ImageObject",
            "url": "https://pathshalaai.co.in/pwa-512x512.png",
            "width": 512,
            "height": 512
          },
          "description": "The all-in-one platform for distraction-free study and maximum productivity — combining focused lecture streaming, structured AI notes, intelligent study planning, and personal AI mentorship.",
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "email": "support@pathshalaai.co.in",
              "contactType": "customer support"
            },
            {
              "@type": "ContactPoint",
              "email": "support@pathshalaai.co.in",
              "contactType": "grievance officer"
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://pathshalaai.co.in/#website",
          "url": "https://pathshalaai.co.in",
          "name": "Pathshala AI",
          "publisher": {
            "@id": "https://pathshalaai.co.in/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://pathshalaai.co.in/discover?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader">
        <style>
          #app-preloader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background-color: #09090b;
            z-index: 99999;
            user-select: none;
          }
          .preloader-logo {
            height: 32px;
            width: 171px;
            max-width: 80vw;
            aspect-ratio: 800 / 150;
            object-fit: contain;
            display: block;
          }
          .preloader-track {
            width: 128px;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
          }
          .preloader-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 45%;
            background-color: #f4f4f5;
            border-radius: 9999px;
            animation: preloaderSlide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            will-change: transform;
          }
          .preloader-dark { display: block; }
          .preloader-light { display: none; }

          html[data-theme="light"] #app-preloader,
          html.light #app-preloader {
            background-color: #ffffff;
          }
          html[data-theme="light"] .preloader-track,
          html.light .preloader-track {
            background-color: rgba(0, 0, 0, 0.08);
          }
          html[data-theme="light"] .preloader-bar,
          html.light .preloader-bar {
            background-color: #09090b;
          }
          html[data-theme="light"] .preloader-dark,
          html.light .preloader-dark {
            display: none;
          }
          html[data-theme="light"] .preloader-light,
          html.light .preloader-light {
            display: block;
          }

          @keyframes preloaderSlide {
            0% { left: -45%; }
            100% { left: 100%; }
          }
        </style>
        <img
          src="/logos/logo-full-white.png"
          alt="Pathshala AI"
          width="171"
          height="32"
          fetchpriority="high"
          decoding="async"
          class="preloader-logo preloader-dark"
        />
        <img
          src="/logos/logo-full-black.png"
          alt="Pathshala AI"
          width="171"
          height="32"
          fetchpriority="high"
          decoding="async"
          class="preloader-logo preloader-light"
        />
        <div class="preloader-track" aria-hidden="true">
          <div class="preloader-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
